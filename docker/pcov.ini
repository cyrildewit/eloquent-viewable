; PCOV only collects coverage when PHP_PCOV_ENABLED is 1, which the coverage
; targets set. It watches the whole project rather than guessing a directory,
; because the coverage report includes database/factories next to src.
pcov.enabled=${PHP_PCOV_ENABLED}
pcov.directory=/var/www/html
pcov.exclude="~^/var/www/html/(vendor|build)/~"
