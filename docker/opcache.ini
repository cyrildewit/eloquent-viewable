; Every CLI process starts with empty shared memory, so the compiled scripts go
; to a file cache on the `opcache` volume instead, where the next run picks them
; up. Timestamps are still validated, so an edited file is compiled again.
opcache.enable_cli=${PHP_OPCACHE_ENABLE_CLI}
opcache.file_cache=/var/cache/opcache
opcache.file_cache_only=1
