services:
  php:
    build:
      context: ./docker
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - bench-sqlite:/var/lib/benchmarks
    environment:
      # PCOV collects coverage only when this is 1, see docker/pcov.ini.
      # `make test-coverage` and `make test-mutation` set it.
      PHP_PCOV_ENABLED: ${PHP_PCOV_ENABLED:-0}
      # Passed through from the shell, left unset when absent. An empty value
      # would override the driver's own default port and host instead.
      DB_CONNECTION:
      DB_HOST:
      DB_PORT:
      # The benchmark targets point this at the `benchmark` database instead.
      DB_DATABASE: ${DB_DATABASE:-testing}
      DB_USERNAME: testing
      DB_PASSWORD: testing
      # The Redis store's tests talk to the `redis` service below, through
      # phpredis and Predis both.
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # The SQLite benchmark dataset lives on a named volume, see below.
      BENCH_SQLITE_PATH: /var/lib/benchmarks/benchmark.sqlite

  composer:
    build:
      context: ./docker
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - bench-sqlite:/var/lib/benchmarks
    entrypoint: ["composer"]
    environment:
      # PCOV collects coverage only when this is 1, see docker/pcov.ini.
      # `make test-coverage` and `make test-mutation` set it.
      PHP_PCOV_ENABLED: ${PHP_PCOV_ENABLED:-0}
      # Passed through from the shell, left unset when absent. An empty value
      # would override the driver's own default port and host instead.
      DB_CONNECTION:
      DB_HOST:
      DB_PORT:
      # The benchmark targets point this at the `benchmark` database instead.
      DB_DATABASE: ${DB_DATABASE:-testing}
      DB_USERNAME: testing
      DB_PASSWORD: testing
      # The Redis store's tests talk to the `redis` service below, through
      # phpredis and Predis both.
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # The SQLite benchmark dataset lives on a named volume, see below.
      BENCH_SQLITE_PATH: /var/lib/benchmarks/benchmark.sqlite

  # The buffer behind the `redis` store driver. Every `php` and `composer` run
  # starts it, because the suite's Redis tests need a real stream, and
  # starting Redis adds almost nothing to a run.
  redis:
    image: redis:7-alpine
    # Two databases per parallel worker, see tests/Feature/TestCase.php. The
    # default of 16 runs out past seven workers.
    command: redis-server --databases 128
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  # `make test-valkey` starts this and points `REDIS_HOST` at it, to run the
  # Redis tests against Valkey instead.
  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --databases 128
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      retries: 20

  # The documentation site in docs/, run through `make docs-*`. node_modules
  # lives on a named volume so the Linux builds of sharp and Rollup never land
  # in the checkout. It sits behind the `docs` profile so nothing else starts it.
  node:
    image: node:22-alpine
    profiles: [docs]
    working_dir: /app/docs
    entrypoint: ["npm"]
    volumes:
      - .:/app
      - docs-node-modules:/app/docs/node_modules
    ports:
      - "4321:4321"

  # `make test-mysql`, `make test-mariadb` and `make test-pgsql` start these and
  # run the suite against them. By hand, for example:
  #   DB_CONNECTION=mysql DB_HOST=mysql DB_PORT=3306 docker compose run --rm composer test
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: testing
      MYSQL_USER: testing
      MYSQL_PASSWORD: testing
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: testing
      MARIADB_USER: testing
      MARIADB_PASSWORD: testing
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: testing
      POSTGRES_USER: testing
      POSTGRES_PASSWORD: testing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testing"]
      interval: 5s
      retries: 20

  # `make bench DRIVER=mysql|mariadb|pgsql` runs the benchmarks against these.
  # They sit behind the `bench` profile so the test targets never start them,
  # and keep their data on named volumes so a seeded dataset survives
  # `make db-stop`. The buffer pool and shared buffers are raised so a medium
  # dataset's indexes fit in memory and a run measures the query shape, not
  # Docker's disk. `docker compose --profile bench down -v` throws the data
  # away.
  bench-mysql:
    image: mysql:8.4
    profiles: [bench]
    command: --innodb-buffer-pool-size=1G
    environment:
      MYSQL_DATABASE: benchmark
      MYSQL_USER: testing
      MYSQL_PASSWORD: testing
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - bench-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  bench-mariadb:
    image: mariadb:11
    profiles: [bench]
    command: --innodb-buffer-pool-size=1G
    environment:
      MARIADB_DATABASE: benchmark
      MARIADB_USER: testing
      MARIADB_PASSWORD: testing
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - bench-mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  bench-postgres:
    image: postgres:17
    profiles: [bench]
    command: -c shared_buffers=1GB -c work_mem=64MB
    shm_size: 1gb
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: testing
      POSTGRES_PASSWORD: testing
    volumes:
      - bench-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testing"]
      interval: 5s
      retries: 20

volumes:
  bench-sqlite:
  bench-mysql:
  bench-mariadb:
  bench-postgres:
  docs-node-modules:
