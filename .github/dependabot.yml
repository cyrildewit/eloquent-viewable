version: 2
updates:

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      labels:
          - "dependencies"

    # Development dependencies only. The runtime constraints in `require`
    # define which Laravel versions this package supports, so they stay a
    # deliberate choice rather than an automated bump.
    - package-ecosystem: "composer"
      directory: "/"
      schedule:
          interval: "weekly"
      allow:
          - dependency-type: "development"
      versioning-strategy: "increase"
      labels:
          - "dependencies"

    # The documentation site, whose pnpm-lock.yaml the npm ecosystem reads.
    # Grouped so Astro, Starlight and their plugins, which move together,
    # arrive in one pull request.
    - package-ecosystem: "npm"
      directory: "/docs"
      schedule:
          interval: "weekly"
      groups:
          docs:
              patterns:
                  - "*"
      labels:
          - "dependencies"
