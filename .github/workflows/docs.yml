name: Docs

on:
  workflow_dispatch:
  # Rebuilds the site monthly so the star count in the header stays current. GitHub only runs schedules from the
  # default branch, so this fires once the workflow is on main; the checkout below then builds the documented branch.
  schedule:
    - cron: '0 6 1 * *'
  push:
    branches:
      - '9.x'
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

# One deployment at a time, and a newer push never waits behind an older one.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # lastUpdated reads each page's date from the git history.
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && '9.x' || '' }}

      # Installs the version pinned by packageManager in docs/package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: docs/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on a broken internal link or anchor, see starlight-links-validator.
      - name: Build the site
        run: pnpm run build
        env:
          # Runners share their IP addresses, so the star count needs an authenticated request.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  # The site follows the release branch being worked on. Move the branch above,
  # and the one the scheduled checkout uses, when a new major becomes the one to document.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
