name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '*.x'
    paths:
      - '**.php'
      - '.github/workflows/tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'

permissions:
    contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        php: [ 8.5 ]
        laravel: [ ^13.0 ]
        stability: [ prefer-lowest, prefer-stable ]
        db: [ sqlite, mysql, mariadb, pgsql ]
        redis: [ redis ]
        include:
          - laravel: ^13.0
            testbench: ^11.0
          - db: sqlite
            connection: testing
          - db: mysql
            connection: mysql
            port: 3306
          - db: mariadb
            connection: mariadb
            port: 3307
          - db: pgsql
            connection: pgsql
            port: 5432
          # One leg swaps Redis for Valkey. It lists every key, because an
          # entry that creates a combination is not extended by the ones above.
          - os: ubuntu-latest
            php: 8.5
            laravel: ^13.0
            testbench: ^11.0
            stability: prefer-stable
            db: sqlite
            connection: testing
            redis: valkey

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.db }} - ${{ matrix.redis }} - ${{ matrix.os }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: testing
          MYSQL_PASSWORD: testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval=5s --health-timeout=5s --health-retries=20

      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: testing
          MARIADB_USER: testing
          MARIADB_PASSWORD: testing
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20

      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U testing" --health-interval=5s --health-timeout=5s --health-retries=20

      # The `redis` store driver's tests run on every leg, through phpredis
      # and Predis, so the SQLite leg's coverage gate sees both clients. The
      # Valkey leg runs them against Valkey instead.
      redis:
        image: ${{ matrix.redis == 'valkey' && 'valkey/valkey:8-alpine' || 'redis:7-alpine' }}
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=2s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: testing
      DB_USERNAME: testing
      DB_PASSWORD: testing
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      # Deprecations fail only the stable SQLite leg. The lowest releases of
      # dependencies raise PHP 8.5 deprecations that later releases fix.
      TESTBENCH_CONVERT_DEPRECATIONS_TO_EXCEPTIONS: ${{ matrix.stability == 'prefer-stable' && matrix.db == 'sqlite' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, pdo_pgsql, redis
          # Only the SQLite leg on Redis collects coverage. PCOV watches the whole
          # checkout, because the report includes database/factories next to src.
          coverage: ${{ matrix.db == 'sqlite' && matrix.redis == 'redis' && 'pcov' || 'none' }}
          ini-values: pcov.directory=${{ github.workspace }}, pcov.exclude="~/(vendor|build)/~"

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.stability }}-

      - name: Install composer dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --dev
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      # Coverage is gated on the SQLite leg on Redis only, so the 100% minimum
      # needs no merging across legs. The other legs run the same suite uncovered.
      - name: Execute tests with coverage
        if: matrix.db == 'sqlite' && matrix.redis == 'redis'
        run: composer run test:coverage -- ${{ matrix.stability == 'prefer-lowest' && '--do-not-fail-on-deprecation' || '' }}

      # Serially: parallel workers would share the one database on the server.
      - name: Execute tests
        if: matrix.db != 'sqlite'
        run: composer run test:serial -- --do-not-fail-on-deprecation

      - name: Execute tests against Valkey
        if: matrix.db == 'sqlite' && matrix.redis == 'valkey'
        run: composer run test

      - name: Upload coverage to Codecov
        if: matrix.db == 'sqlite' && matrix.redis == 'redis'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
