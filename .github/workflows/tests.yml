name: Tests

on:
  workflow_dispatch:
  # Pushes to the long-lived branches only. A feature branch is checked
  # through its pull request, so it does not run twice.
  push:
    branches:
      - main
      - '*.x'
    paths:
      - '**.php'
      - '.github/workflows/tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'

permissions:
    contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        php: [ 8.5 ]
        laravel: [ ^13.0 ]
        stability: [ prefer-lowest, prefer-stable ]
        db: [ sqlite, mysql, mariadb, pgsql ]
        include:
          - laravel: ^13.0
            testbench: ^11.0
          - db: sqlite
            connection: testing
          - db: mysql
            connection: mysql
            port: 3306
          - db: mariadb
            connection: mariadb
            port: 3307
          - db: pgsql
            connection: pgsql
            port: 5432

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.db }} - ${{ matrix.os }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: testing
          MYSQL_PASSWORD: testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval=5s --health-timeout=5s --health-retries=20

      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: testing
          MARIADB_USER: testing
          MARIADB_PASSWORD: testing
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20

      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U testing" --health-interval=5s --health-timeout=5s --health-retries=20

      # The `redis` store driver's tests run on every leg, through phpredis
      # and Predis, so the SQLite leg's coverage gate sees both clients.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=2s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: testing
      DB_USERNAME: testing
      DB_PASSWORD: testing
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, pdo_pgsql, redis
          coverage: xdebug

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.stability }}-

      - name: Install composer dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --dev
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      # Coverage is gated on the SQLite leg only, so the 100% minimum needs no
      # merging across drivers. The other legs run the same suite uncovered.
      - name: Execute tests with coverage
        if: matrix.db == 'sqlite'
        run: composer run test:coverage

      # Serially: parallel workers would share the one database on the server.
      - name: Execute tests
        if: matrix.db != 'sqlite'
        run: composer run test:serial

      - name: Upload coverage to Codecov
        if: matrix.db == 'sqlite'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
